name: Report evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_report_data.py
      - run: python -m unittest discover -s tests -p 'test_report_evidence.py'
